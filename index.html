<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>For My Bestiee Divuu ✨</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#ff7eb6;--rose:#ff4f91;--purple:#9c7cff;--cream:#fff5e8;--dark:#080612}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 20%,#21153b 0%,#0b0715 45%,#030207 100%);color:white;min-height:100vh}

/* STAR FIELD */
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.7;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}

/* MOON */
.moon{position:fixed;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f5e8ff 55%,#d6c4ef);box-shadow:0 0 40px rgba(255,235,255,.35),0 0 120px rgba(191,157,255,.16);top:-65px;right:-45px;opacity:.9;z-index:0}
.moon:after{content:"";position:absolute;inset:20px;border-radius:50%;background:rgba(160,135,180,.09);box-shadow:45px 20px 0 -5px rgba(120,100,150,.12),15px 65px 0 -8px rgba(120,100,150,.1)}

/* APP */
#app{position:relative;z-index:2;min-height:100vh}

/* SCREENS */
.screen{min-height:100vh;width:100%;display:none;align-items:center;justify-content:center;flex-direction:column;padding:25px;text-align:center}
.screen.active{display:flex}

/* INTRO */
.kicker{letter-spacing:5px;font-size:11px;opacity:.65;margin-bottom:20px;animation:fadeUp 1.2s both}
.intro-title{font-size:clamp(38px,11vw,78px);line-height:.95;font-weight:400;text-shadow:0 0 20px rgba(255,126,182,.3);animation:titleIn 1.4s cubic-bezier(.2,.8,.2,1) both}
.intro-title span{color:#ff91c5}
.subtitle{max-width:450px;margin:25px auto 35px;font-size:15px;line-height:1.7;opacity:.75;animation:fadeUp 1.5s .3s both}
